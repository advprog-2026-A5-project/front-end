name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "staging", "develop", "feat/**", "fix/**", "chore/**"]
    paths:
      - "front-end/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "front-end/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
